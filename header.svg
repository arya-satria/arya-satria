<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Arya Satria banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.55" stop-color="#030a1c"/>
      <stop offset="1" stop-color="#06173a"/>
    </linearGradient>

    <filter id="smokeA" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.011" numOctaves="4" seed="7" result="n">
        <animate attributeName="baseFrequency" dur="26s" values="0.005 0.011;0.008 0.015;0.005 0.011" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.38  0 0 0 0 0.95  1.7 0 0 0 -0.55"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <filter id="smokeB" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.018" numOctaves="3" seed="21" result="n">
        <animate attributeName="baseFrequency" dur="19s" values="0.009 0.018;0.013 0.012;0.009 0.018" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.02  0 0 0 0 0.60  0 0 0 0 0.90  1.6 0 0 0 -0.62"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="smokeMask">
      <rect width="900" height="260" fill="url(#fade)"/>
    </mask>

    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="clip"><rect width="900" height="260"/></clipPath>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>

  <g clip-path="url(#clip)" mask="url(#smokeMask)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-60 0;40 -8;-60 0" dur="30s" repeatCount="indefinite"/>
      <rect x="-120" y="-20" width="1140" height="300" filter="url(#smokeA)" opacity="0.75"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="50 6;-50 -6;50 6" dur="22s" repeatCount="indefinite"/>
      <rect x="-120" y="-20" width="1140" height="300" filter="url(#smokeB)" opacity="0.45"/>
    </g>
  </g>

  <g fill="#bfe3ff">
    <circle cx="90" cy="46" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="198" r="1.1"><animate attributeName="opacity" values="1;0.1;1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="34" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="212" r="1.5"><animate attributeName="opacity" values="1;0.15;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="52" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="170" r="1.1"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="22" r="1" ><animate attributeName="opacity" values="0.1;1;0.1" dur="5s" repeatCount="indefinite"/></circle>
  </g>

  <text x="450" y="128" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="10" fill="#e0f2fe" filter="url(#glow)">ARYA SATRIA</text>
  <text x="450" y="170" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" letter-spacing="6" fill="#60a5fa">INFORMATION SYSTEMS GRADUATE</text>

  <rect x="330" y="192" width="240" height="2" fill="#38bdf8" opacity="0.7">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
