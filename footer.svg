<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06173a"/>
      <stop offset="0.5" stop-color="#030a1c"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>

    <filter id="smoke" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.014" numOctaves="4" seed="13" result="n">
        <animate attributeName="baseFrequency" dur="24s" values="0.006 0.014;0.01 0.02;0.006 0.014" repeatCount="indefinite"/>
      </feTurbulence>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.38  0 0 0 0 0.95  1.7 0 0 0 -0.55"/>
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <radialGradient id="fade" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="900" height="140" fill="url(#fade)"/></mask>

    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="900" height="140"/></clipPath>
  </defs>

  <rect width="900" height="140" fill="url(#bg)"/>

  <g clip-path="url(#clip)" mask="url(#m)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-50 0;50 -6;-50 0" dur="28s" repeatCount="indefinite"/>
      <rect x="-120" y="-20" width="1140" height="180" filter="url(#smoke)" opacity="0.7"/>
    </g>
  </g>

  <g fill="#bfe3ff">
    <circle cx="120" cy="30" r="1.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="105" r="1.1"><animate attributeName="opacity" values="1;0.1;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="28" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="100" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <text x="450" y="78" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="8" fill="#e0f2fe" filter="url(#glow)">THANKS FOR VISITING</text>
</svg>
